<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quarto PS2</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #050305; --fg: #f2efe6; --dim: #8a8478; --red: #ff2020; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px; gap: 12px; }
  #c { width: min(100%, 1280px); aspect-ratio: 16 / 9; background: #000; display: block; }
  body.vertical #c { width: auto; height: min(80vh, 1280px); aspect-ratio: 9 / 16; }
  #ui { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; max-width: 1280px; width: 100%; }
  #ui[hidden] { display: none; }
  label { display: grid; gap: 4px; color: var(--dim); }
  input { background: #120e12; color: var(--fg); border: 1px solid #3a2a30; padding: 6px 8px; font: inherit; width: 9em; }
  input[type=file] { width: 16em; }
  input[type=checkbox] { width: auto; }
  button { background: var(--red); color: #000; border: 0; padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  body.render { padding: 0; display: block; min-height: 0; }
  body.render #c { width: auto; aspect-ratio: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" hidden>
  <label>Áudio (mp3/wav)<input id="file" type="file" accept="audio/*"></label>
  <label>Início (s)<input id="start" type="number" step="0.001" value="2.084"></label>
  <label>BPM<input id="bpm" type="number" step="0.01" value="116"></label>
  <label>Compassos<input id="bars" type="number" value="8"></label>
  <label>Vertical 9:16<input id="vert" type="checkbox"></label>
  <button id="go">▶ tocar</button>
</div>
<script>if (location.search.includes('render')) document.body.classList.add('render');</script>
<script type="module" src="./main.js"></script>
</body>
</html>
